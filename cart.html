<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оформлення замовлення</title>
  <link rel="stylesheet" href="cart.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

</head>
<body>
<div class="container">
  <h1>Ваше замовлення</h1>
  <div class="nav-links">
    <a href="index.html">← На головну</a>
  </div>

  <table id="cart-table">
    <thead>
      <tr><th>Назва</th><th>Ціна</th><th>Дія</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="total" id="total">Разом: 0 грн</div>

  <form id="order-form" autocomplete="off">
    <input type="text" name="surname" placeholder="Прізвище" required />
    <input type="text" name="name" placeholder="Імʼя" required />
    <input type="text" name="patronymic" placeholder="По батькові" />
    <input type="tel" name="phone" id="phone" placeholder="+380XXXXXXXXX" required
           pattern="^\+380\d{9}$" inputmode="tel" maxlength="13"
           title="Введіть номер у форматі +380XXXXXXXXX" />

    <label>Місто</label>
    <input type="text" id="city-input" name="city" required placeholder="Введіть місто" />

    <label>Адреса / № відділення</label>
    <input type="text" id="wh-input" name="warehouse" required placeholder="Адреса/№ відділення" />

    <button type="submit">Надіслати замовлення</button>
  </form>

  <div id="status" style="margin-top:1em; font-weight:bold;"></div>
</div>

</body>
</html>
