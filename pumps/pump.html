<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Картка насоса</title>
  <style>
    body { font-family: sans-serif; background: #024c98; color: white; margin: 0; background-image: url(../images/background-water.jpg); animation: gradientMove 15s ease infinite;}
    @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @media (max-width: 768px) {
  body{
    animation: gradientMove 25s ease infinite;
  }
}
    .container { padding: 1em; max-width: 900px; margin: auto; }
    .product { display: flex; flex-wrap: wrap; background: white; color: black; border-radius: 10px; padding: 1em; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
    .product img { max-width: 300px; width: 100%; margin-right: 2em; object-fit: contain; }
    .info { flex: 1; }
    .price { font-size: 1.6em; color: red; margin: 0.5em 0; }
    .buy-btn { background: #0b6fc7; color: white; border: none; padding: 10px 20px; font-size: 1em; border-radius: 5px; cursor: pointer; }
    .description { background: #f0f0f0; color: #000; margin-top: 1em; padding: 1em; border-radius: 10px; }
    a { color: #fff; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <p><a href="../index.html">← Назад до каталогу</a></p>
    <div class="product">
      <img id="pump-img" src="" alt="Фото насоса">
      <div class="info">
        <h1 id="pump-title"></h1>
        <p class="price" id="pump-price"></p>
        <button class="buy-btn">Купити</button>
        <p><strong>Виробник:</strong> <span id="pump-brand"></span></p>
        <p><strong>Наявність:</strong> <span id="pump-stock"></span></p>
      </div>
    </div>

    <div class="description">
      <h2>Опис</h2>
      <p id="pump-desc"></p>
      <h3>Гарантія</h3>
      <p id="pump-warranty"></p>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const supabaseUrl = 'https://aaxvtwqktggbjmxsmtyl.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFheHZ0d3FrdGdnYmpteHNtdHlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc1MTYyMzksImV4cCI6MjA3MzA5MjIzOX0.y-DbmKs1r-o4uPq66Yqwcg1a4_0dbtaEmbdeL6VIKZY'; 

  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  async function loadPump() {
    const { data, error } = await supabase
      .from('products')
      .select('*')
      .eq('id', id)
      .single();

    if (error || !data) {
      document.querySelector(".container").innerHTML = "<h2>Насос не знайдено 😢</h2>";
      return;
    }

    document.getElementById("pump-img").src = data.img;
    document.getElementById("pump-title").textContent = data.title;
    document.getElementById("pump-price").textContent = data.price;
    document.getElementById("pump-brand").textContent = data.brand;
    document.getElementById("pump-stock").textContent = data.stock;
    document.getElementById("pump-desc").innerHTML = data.desc;
    document.getElementById("pump-warranty").textContent = data.warranty;

    document.querySelector('.buy-btn').addEventListener('click', () => {
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.push(id);
      localStorage.setItem('cart', JSON.stringify(cart));
      alert("Товар додано до кошика!");
    });
  }

  loadPump();
</script>


</body>
</html>
