<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="meta-title"></title>
    <meta name="description" id="meta-description" />
    <link rel="canonical" id="meta-canonical" />
    <link rel="stylesheet" href="pump.css" />
    <link rel="stylesheet" href="../movingbubbles.css" type="text/css" />
    <script type="application/ld+json" id="schema-json"></script>
  </head>
  <body>
    <div id="loader-wrapper">
      <div class="loader"></div>
    </div>

    <div class="container">
      <p><a href="../index.html">← Назад до каталогу</a></p>
      <div class="product" id="product-container" style="display: none">
        <img id="pump-img" src="" alt="Фото насоса" />
        <div class="info">
          <h1 id="pump-title"></h1>
          <p class="price" id="pump-price"></p>
          <button class="buy-btn">Купити</button>
          <p><strong>Виробник:</strong> <span id="pump-brand"></span></p>
          <p><strong>Наявність:</strong> <span id="pump-stock"></span></p>
        </div>
      </div>

      <div class="description">
        <h2>Опис</h2>
        <div id="pump-desc" class="pump-description"></div>
        <h3>Гарантія</h3>
        <p id="pump-warranty"></p>
      </div>
    </div>
    <div id="toast">Товар додано до кошика!</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/pumps/pump.js" defer></script>
    <script src="../movingbubbles.js" type="text/javascript"></script>
  </body>
</html>
